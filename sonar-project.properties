# SonarCloud — análise de qualidade (usado pelo job "quality" quando SONAR_TOKEN existe).
# Crie o projeto em https://sonarcloud.io importando o repositório do GitHub e
# confira se organization/projectKey batem com o que o SonarCloud mostrar.
sonar.organization=gugow06
sonar.projectKey=gugow06_plantguard
sonar.projectName=PlantGuard (AgroSmart)

sonar.sources=src,infra
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts
sonar.exclusions=src/generated/**,src/components/ui/**,**/*.test.ts
sonar.coverage.exclusions=src/app/**,src/components/**,src/hooks/**,infra/**,src/lib/prisma.ts,src/lib/auth*.ts,src/lib/kafka.ts,src/lib/email.ts,src/lib/gemini*.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
